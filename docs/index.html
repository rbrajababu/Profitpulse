    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect restoration
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
    <script type="text/javascript">
      // GitHub Pages root static fallback:
      // When deployed directly from repository root on GitHub Pages without a bundler,
      // seamlessly redirect to the pre-bundled production build in /docs/
      (function() {
        var isGitHubPages = window.location.hostname.endsWith('github.io');
        if (isGitHubPages && !window.location.pathname.includes('/docs')) {
          var cleanBase = window.location.pathname.replace(/\/index\.html$/, '').replace(/\/$/, '');
          window.location.replace(cleanBase + '/docs/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <div id="root"></div>
  </body>
